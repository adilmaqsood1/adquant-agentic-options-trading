[project]
name = "adquant-options-trading"
version = "1.0.0"
description = "AdQuant — High-Performance Autonomous Options Trading Engine powered by Alpaca, DeepSeek-V3.2, and MCP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.36",
    "alpaca-py>=0.21.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "vadersentiment>=3.3.2",
    "tabulate>=0.9.0",
    "mcp>=1.0.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

