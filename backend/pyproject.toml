[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adquant-options-trading"
version = "1.0.0"
description = "High-performance autonomous quantitative options trading engine powered by Alpaca Trading API, Model Context Protocol (MCP), and Featherless DeepSeek-V3.2"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AdQuant Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.36",
    "alpaca-py>=0.21.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.28",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "vaderSentiment>=3.3.2",
    "tabulate>=0.9.0",
    "mcp>=1.0.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.30",
]

[project.scripts]
alpaca-cli = "alpaca_cli:main"
alpaca-mcp = "mcp_server:run_fastmcp"

[tool.fastapi]
app = "main:app"
